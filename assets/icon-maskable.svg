<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NAI Tag Viewer">
  <!--
    안드로이드 홈화면용. 어떤 모양으로 잘려도 살아남도록
    icon.svg 의 그림을 가운데 안전 영역(약 66%)으로 줄여 놓았다.
  -->
  <defs>
    <linearGradient id="bg" x1="2" y1="0" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".52" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="9" y="20" width="42" height="29" rx="5.5"/>
    </clipPath>

    <path id="spark" d="M0,-1 Q.18,-.18 1,0 Q.18,.18 0,1 Q-.18,.18 -1,0 Q-.18,-.18 0,-1 Z"/>
  </defs>

  <rect width="64" height="64" fill="url(#bg)"/>

  <g transform="translate(32 32) scale(.66) translate(-30 -32)">
    <rect x="9" y="20" width="42" height="29" rx="5.5" fill="#fff" fill-opacity=".22"/>
    <g clip-path="url(#frame)">
      <circle cx="19" cy="29" r="4" fill="#fff"/>
      <path d="M9 49.5 L22 34 L30 42 L38 33 L51 46 L51 49.5 Z" fill="#fff"/>
    </g>
    <rect x="9" y="20" width="42" height="29" rx="5.5" fill="none" stroke="#fff" stroke-width="3"/>
    <use href="#spark" transform="translate(53 9.5) scale(7)" fill="#fff"/>
  </g>
</svg>
