    <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="16" width="42" height="34" rx="6"/>
      <circle cx="16" cy="25.5" r="3.5" stroke-width="3.5"/>
      <path d="M9 48 L21 33 L29 41 L37 32 L49 46" clip-path="url(#inner)"/>
    </g>
    <use href="#spark" transform="translate(53 12) scale(8)" fill="#111"/>
